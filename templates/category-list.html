<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kategoriyalar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #12131a;
    --bg-card: #1a1c26;
    --gold: #e8b44c;
    --gold-soft: rgba(232, 180, 76, 0.12);
    --text: #f2f1ec;
    --text-muted: #9a9aa5;
    --border: #2a2c38;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 48px 24px;
  }

  .wrap {
    max-width: 760px;
    margin: 0 auto;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 32px;
    flex-wrap: wrap;
    gap: 16px;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 32px;
    color: var(--gold);
  }

  .subtitle {
    color: var(--text-muted);
    font-size: 14px;
    margin-top: 4px;
  }

  .btn-new {
    background: var(--gold);
    color: #12131a;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
  }

  .btn-new:hover { opacity: 0.9; }

  .category-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .category-item {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    text-decoration: none;
    color: var(--text);
    transition: border-color 0.15s ease, transform 0.15s ease;
  }

  .category-item:hover {
    border-color: var(--gold);
    transform: translateX(2px);
  }

  .category-item.active {
    border-color: var(--gold);
    background: var(--gold-soft);
  }

  .category-name {
    font-weight: 500;
    font-size: 16px;
  }

  .category-count {
    font-size: 13px;
    color: var(--text-muted);
    background: rgba(255,255,255,0.05);
    padding: 4px 10px;
    border-radius: 999px;
    min-width: 28px;
    text-align: center;
  }

  .empty-state {
    text-align: center;
    padding: 64px 20px;
    color: var(--text-muted);
  }

  .empty-state p { margin-top: 8px; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div>
      <h1>Kategoriyalar</h1>
      <div class="subtitle">
        {% if categories %}Jami {{ categories|length }} ta kategoriya{% endif %}
      </div>
    </div>
    <a href="/admin/apps/category/add/" class="btn-new">+ Yangi kategoriya</a>
  </div>

  {% if categories %}
  <div class="category-list">
    {% for category in categories %}
    <div class="category-item">
      <span class="category-name">{{ category.title }}</span>
      <span class="category-count">#{{ category.id }}</span>
    </div>
    {% endfor %}
  </div>
  {% else %}
  <div class="empty-state">
    <div style="font-size: 40px;">🗂️</div>
    <p>Hozircha kategoriyalar yo'q. Yangisini qo'shing.</p>
  </div>
  {% endif %}
</div>
</body>
</html>
